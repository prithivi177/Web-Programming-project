<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/><stop offset="100%" stop-color="#1B3818"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#2C1810" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F2E9E4"/>
      <stop offset="100%" stop-color="#E2D4CC"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bg)"/>
  
  <ellipse cx="300" cy="310" rx="220" ry="60" fill="#000000" opacity="0.1" filter="url(#softShadow)"/>
  <ellipse cx="300" cy="305" rx="210" ry="50" fill="url(#plateGrad)"/>
  <ellipse cx="300" cy="305" rx="180" ry="40" fill="none" stroke="#DDA15E" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Pistachio Cranberry Shortbread Cookies -->
  <g transform="translate(300, 240)">
    <!-- Back cookie -->
    <ellipse cx="40" cy="-20" rx="60" ry="45" fill="#E9D8A6" stroke="#C3A675" stroke-width="2"/>
    <ellipse cx="25" cy="-30" rx="5" ry="8" fill="#588157" transform="rotate(35 25 -30)"/>
    <ellipse cx="60" cy="-15" rx="4" ry="6" fill="#9B2226" transform="rotate(-15 60 -15)"/>
    <!-- Front cookie -->
    <ellipse cx="-20" cy="5" rx="75" ry="55" fill="#F4E0A5" stroke="#D4A373" stroke-width="2.5"/>
    <!-- Pistachio pieces -->
    <ellipse cx="-55" cy="5" rx="7" ry="11" fill="#70A970" transform="rotate(25 -55 5)"/>
    <ellipse cx="-25" cy="-20" rx="6" ry="10" fill="#588157" transform="rotate(-40 -25 -20)"/>
    <ellipse cx="10" cy="-10" rx="7" ry="11" fill="#70A970" transform="rotate(15 10 -10)"/>
    <ellipse cx="-15" cy="25" rx="6" ry="9" fill="#588157" transform="rotate(50 -15 25)"/>
    <ellipse cx="25" cy="18" rx="6.5" ry="10" fill="#70A970" transform="rotate(-25 25 18)"/>
    <!-- Dried Cranberries ruby bits -->
    <ellipse cx="-40" cy="-15" rx="6" ry="9" fill="#9B2226" transform="rotate(-30 -40 -15)"/>
    <ellipse cx="-5" cy="5" rx="7" ry="10" fill="#AE2012" transform="rotate(20 -5 5)"/>
    <ellipse cx="30" cy="-15" rx="6.5" ry="9" fill="#9B2226" transform="rotate(45 30 -15)"/>
    <ellipse cx="0" cy="35" rx="5" ry="8" fill="#AE2012" transform="rotate(-10 0 35)"/>
    <!-- Sugar sparkles -->
    <circle cx="-30" cy="15" r="1.5" fill="#FFF"/>
    <circle cx="15" cy="5" r="1.5" fill="#FFF"/>
    <circle cx="-10" cy="-8" r="1.5" fill="#FFF"/>
  </g>

  <!-- Badge -->
  <g transform="translate(460, 30)">
    <rect width="110" height="32" rx="16" fill="#4A2E18" opacity="0.85"/>
    <text x="55" y="21" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#FFF" text-anchor="middle" letter-spacing="1">Artisan</text>
  </g>
</svg>
