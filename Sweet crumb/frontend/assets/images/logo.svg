<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E29578"/>
      <stop offset="100%" stop-color="#B05B3B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDA15E"/>
      <stop offset="100%" stop-color="#BC6C25"/>
    </linearGradient>
  </defs>
  <!-- Cupcake Icon -->
  <g transform="translate(10, 10)">
    <!-- Liner base -->
    <path d="M 16 35 L 22 55 L 42 55 L 48 35 Z" fill="#DDA15E" stroke="#BC6C25" stroke-width="2"/>
    <path d="M 24 35 L 27 55 M 32 35 L 32 55 M 40 35 L 37 55" stroke="#BC6C25" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Frosting swirl -->
    <path d="M 12 35 C 12 25, 22 25, 26 26 C 28 20, 36 20, 38 26 C 42 25, 52 25, 52 35 Z" fill="url(#crumbGrad)"/>
    <path d="M 22 26 C 24 16, 38 16, 40 26 Z" fill="#F7D6D0"/>
    <!-- Cherry on top -->
    <circle cx="32" cy="14" r="5" fill="#C1121F"/>
    <path d="M 34 11 C 38 4, 44 6, 46 2" fill="none" stroke="#283618" stroke-width="2" stroke-linecap="round"/>
    <!-- Sprinkles -->
    <circle cx="22" cy="30" r="1.5" fill="#FFE6A7"/>
    <circle cx="32" cy="27" r="1.5" fill="#FFF"/>
    <circle cx="42" cy="31" r="1.5" fill="#FFE6A7"/>
  </g>
  <!-- Typography -->
  <text x="75" y="42" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#4A2E18">Sweet Crumbs</text>
  <text x="77" y="58" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#BC6C25">ARTISAN BAKERY &amp; CAFE</text>
</svg>
