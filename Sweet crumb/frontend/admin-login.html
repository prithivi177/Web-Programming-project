<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login — Sweet Crumbs Bakery</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <a href="index.html">
        <img src="assets/images/logo.svg" alt="Sweet Crumbs Logo" class="brand-img">
      </a>
      <h2>Staff &amp; Admin Portal</h2>
      <p>Log in to manage bakery orders, customer inquiries, and the fresh product catalogue.</p>

      <!-- Alert Box -->
      <div id="login-alert-box" class="d-none"></div>

      <form id="admin-login-form" novalidate>
        <div class="mb-3 text-start">
          <label for="admin-username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="admin-username" name="username" placeholder="e.g. admin" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4 text-start">
          <label for="admin-password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" class="form-control border-start-0" id="admin-password" name="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary-bakery w-100 py-3 fw-semibold">
          <span id="login-btn-text"><i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard</span>
          <span id="login-btn-spinner" class="d-none"><span class="spinner-border spinner-border-sm me-2"></span> Authenticating...</span>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-muted small">
        <i class="bi bi-info-circle me-1 text-warning"></i> Default setup credential: <code>admin</code> / <code>Admin@123</code>
        <div class="mt-2">
          <a href="index.html" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Public Bakery Website</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Admin Login Script -->
  <script src="js/admin-login.js"></script>
</body>
</html>
